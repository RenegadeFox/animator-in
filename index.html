<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animator In.com Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full screen button (top right corner) and its help message -->
  <button type="button" class="fullscreen-button" id="fullscreen-button">⛶ Full Screen</button>
  <p class="message-box fullscreen-tip" id="fullscreen-tip" hidden>
    Full screen is blocked here. On iPad, tap the Share button, then "Add to Home Screen," and open it from there for full screen.
  </p>

  <!-- The login card in the middle of the page -->
  <main class="login-card">
    <img class="logo-image" src="logo.gif" alt="Three stick figures, one red, one green and one yellow, standing in a circle">

    <h1 class="login-title">Animator In.com Login</h1>
    <p class="login-subtitle">Please enter your account details below to gain access:</p>

    <form id="login-form" autocomplete="off">
      <div class="input-group">
        <input type="text" id="username-input" placeholder="Username" aria-label="Username">
      </div>

      <div class="input-group">
        <input type="password" id="password-input" placeholder="Password" aria-label="Password">
      </div>

      <div class="input-group">
        <input type="text" id="email-input" placeholder="Email" aria-label="Email">
      </div>

      <button type="submit" class="login-button">Continue</button>
    </form>

    <!-- Starts hidden. script.js shows it when the login is wrong.
         When the login is right, script.js sends you to portal.html instead. -->
    <div class="message-box error-message" id="error-message" role="alert" hidden>
      ❌ Incorrect login details. Please try again.
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
