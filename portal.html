<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animator In.com Portal</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <div class="stage">

    <!-- Purple stick figure (bobs up and down) -->
    <img class="purple-stick-figure" src="images/purple-stick-figure.webp" alt="A purple stick figure with gray wings">

    <!-- The big blue box in the middle -->
    <main class="blue-box" id="blue-box">
      <p class="box-text">Congratulations you logged in. Enjoy the show.</p>
      <img class="dancers-gif" src="images/dancers.gif" alt="A black stick figure and an orange stick figure dancing">
      <p class="box-text">But still, if you wanna watch without ads, get premium</p>
    </main>

    <!-- Pig with a diamond sword (runs at the blue box and swings) -->
    <img class="sword-pig" src="images/pig.webp" alt="A pig wearing diamond armor with wings, holding a diamond sword">

  </div>

</body>
</html>
