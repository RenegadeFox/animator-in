<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animator In.com Ask Teal</title>
  <link rel="stylesheet" href="teal.css">
</head>
<body>

  <!-- The loading screens (the same animation every time, only the words at the top change) -->
  <main class="loading-screen" id="loading-screen">
    <img class="loading-animation" src="images/teal-loading.gif" alt="Loading">
    <p class="loading-words" id="loading-words" role="status"></p>
    <a class="cancel-link" href="watch.html">✕ Cancel</a>
  </main>

  <!-- The screen you get after loading when you have not watched anything yet.
       This is a placeholder until the real screen is added. -->
  <main class="nothing-watched-screen" id="nothing-watched-screen" hidden>
    <h1 class="nothing-watched-title">You haven't watched anything yet</h1>
    <p class="nothing-watched-text">Watch some shows and movies, then ask Teal again!</p>
    <a class="back-button" href="watch.html">Back to shows</a>
  </main>

  <script src="teal.js"></script>
</body>
</html>
