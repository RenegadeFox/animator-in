<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animator In.com Ask Teal</title>
  <link rel="stylesheet" href="teal.css?v=2">
</head>
<body>

  <!-- The loading screens (the same animation every time, only the words at the top change) -->
  <main class="loading-screen" id="loading-screen">
    <img class="loading-animation" src="images/teal-loading.gif" alt="Loading">
    <p class="loading-words" id="loading-words" role="status"></p>
    <a class="cancel-link" href="watch.html">✕ Cancel</a>
  </main>

  <!-- The screens where Teal tells you what to watch (teal.js changes the words) -->
  <main class="result-screen" id="result-screen" hidden>
    <img class="result-background" src="images/teal-background.webp" alt="Teal, a light blue stick figure with glasses, standing in front of a big building">
    <div class="result-text" id="result-text" role="status">
      <p class="result-words" id="result-words"></p>
      <!-- The reason under Teal's pick (only used when you have watched something) -->
      <p class="result-reason" id="result-reason" hidden></p>
    </div>
    <a class="back-button" href="watch.html">Back to shows</a>
  </main>

  <script src="account.js?v=3"></script>
  <script src="teal.js?v=2"></script>
</body>
</html>
