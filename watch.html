<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animator In.com Watch</title>
  <link rel="stylesheet" href="watch.css">
</head>
<body>

  <!-- Top bar: the site name, and the profile you picked -->
  <header class="top-bar">
    <span class="site-name">Animator In.com</span>
    <nav class="profile-menu" aria-label="Profile">
      <a class="profile-chip" href="choose-account.html" title="Edit profile">
        <img class="profile-chip-image" id="profile-image" src="" alt="">
        <span class="profile-chip-name" id="account-name"></span>
      </a>
      <a class="log-out-link" href="index.html">Log out</a>
    </nav>
  </header>

  <main class="watch-page">
    <h1 class="visually-hidden">Watch</h1>

    <!-- The shows and movies (watch.js puts them in here) -->
    <section aria-label="Shows and movies">
      <div class="show-row" id="show-row"></div>
      <p class="no-results" id="no-results" hidden>No shows found. Try a different name.</p>
    </section>

    <!-- Ask Teal: will pick shows for you based on what you have watched -->
    <button type="button" class="teal-card" id="teal-button">
      <img class="teal-image" src="images/ask-teal.webp" alt="Ask Teal">
    </button>

    <!-- Shows a short message when you press a show or Teal -->
    <p class="status-message" id="status-message" role="status" hidden></p>

    <!-- Search bar -->
    <form class="search-form" id="search-form" role="search">
      <input class="search-input" id="search-input" type="search" placeholder="Search shows and movies" aria-label="Search shows and movies" autocomplete="off">
    </form>
  </main>

  <script src="account.js?v=2"></script>
  <script src="shows.js?v=5"></script>
  <script src="watch.js?v=3"></script>
</body>
</html>
